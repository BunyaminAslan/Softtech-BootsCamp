schema_version: "1.1"
name: routing-small
description: Tek dosyalık küçük bir düzeltmeyi ana oturum kendisi yapar; takım başlatılmaz.
tags: [smoke, routing]
plugins: ["../../../plugin"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Agent, Skill, Read, Glob, Grep]
  prompt: |
    NOTES.md dosyasındaki "Kurulm" yazım hatasını "Kurulum" olarak düzelt.
graders:
  - name: agent-baslatilmadi
    type: tool_used
    tool: Agent
    min: 0
    max: 0
  - name: duzeltildi
    type: regex
    target: { source: file, path: NOTES.md }
    pattern: '^## Kurulum$'
    flags: m
