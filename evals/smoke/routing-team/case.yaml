schema_version: "1.1"
name: routing-team
description: Birden fazla alanı etkileyen yeni proje isteği ana oturumda kalmaz, takıma (team skill'i veya tech-lead) paslanır.
tags: [smoke, routing]
plugins: ["../../../plugin"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 4
  timeout_seconds: 240
  allowed_tools: [Agent, Skill, Read, Glob, Grep]
  prompt: |
    Yeni bir proje istiyorum: backend API'si ve web arayüzü olan basit bir not alma uygulaması. Notlar eklenip silinebilsin.
graders:
  - name: takima-paslandi
    type: regex
    target: trace
    pattern: '"skill"\s*:\s*"(agent-team:)?team"|"subagent_type"\s*:\s*"agent-team:tech-lead"'
  - name: ana-oturum-kod-yazmadi
    type: file_exists
    path: "{backend,web}/**/*.{js,ts,tsx,jsx,cs,py}"
    exists: false
