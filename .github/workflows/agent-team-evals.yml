name: agent-team evals

# Davranış testleri gerçek model çağrısı yapar ve ücretlidir; yalnızca elle tetiklenir.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Paket: smoke (L1, ~$1.5) veya full (L2, ~$6.5)"
        required: true
        default: smoke
        type: choice
        options: [smoke, full]
      max_cost_usd:
        description: "Bütçe tavanı (USD); boşsa paket varsayılanı"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sandbox bağımlılıkları
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      - name: Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_MAX_COST_USD: ${{ inputs.max_cost_usd }}
        run: |
          [ -n "$EVAL_MAX_COST_USD" ] || unset EVAL_MAX_COST_USD
          bash evals/run.sh "${{ inputs.suite }}" --output-dir "evals/${{ inputs.suite }}/results/ci"
      - name: Rapor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ inputs.suite }}
          path: evals/${{ inputs.suite }}/results/ci/
          if-no-files-found: ignore
